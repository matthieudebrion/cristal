<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#f6f6f4"/>
  <rect x="88" y="178" width="904" height="4" fill="#012169"/>

  <text x="88" y="258" fill="#012169" font-size="28" font-weight="700" letter-spacing="5">CRISTAL · ESSAY</text>

  <text x="88" y="484" fill="#1f1f1e" font-size="102" font-weight="600" letter-spacing="-4">
    <tspan x="88" dy="0">Artificial</tspan>
    <tspan x="88" dy="116">Consciousness</tspan>
